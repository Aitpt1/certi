<!DOCTYPE html>
<html>
<head>
  <style>
    /* ปรับแต่งสไตล์เฉพาะของ Login Modal */
    .login-modal-content {
      border: none;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    }
    .login-header {
      background: linear-gradient(135deg, #343a40 0%, #212529 100%);
      color: white;
      border: none;
      padding: 1.5rem;
    }
    .login-header .btn-close {
      filter: invert(1); /* ทำให้ปุ่ม X เป็นสีขาว */
    }
    .custom-input-group {
      background-color: #f8f9fa;
      border-radius: 12px;
      border: 1px solid #dee2e6;
      transition: all 0.3s;
    }
    .custom-input-group:focus-within {
      border-color: #343a40;
      box-shadow: 0 0 0 0.2rem rgba(52, 58, 64, 0.1);
      background-color: #fff;
    }
    .custom-input-group .input-group-text {
      background-color: transparent;
      border: none;
      color: #6c757d;
    }
    .custom-input-group .form-control {
      background-color: transparent;
      border: none;
      padding: 0.75rem 0.5rem;
    }
    .custom-input-group .form-control:focus {
      box-shadow: none;
    }
    .btn-login-submit {
      border-radius: 12px;
      padding: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      transition: all 0.3s;
    }
    .btn-login-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

<div class="modal fade" id="myModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content login-modal-content">
      <div class="modal-header login-header">
        <h5 class="modal-title fw-bold" id="exampleModalLabel"><i class="fa-solid fa-shield-halved me-2"></i>Admin Login</h5>
        <button type="button" class="btn-close" id="btnclose" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4">
        <form id="loginForm" onsubmit="loginForm(this)">
          
          <div class="mb-3">
            <label class="form-label small fw-bold text-muted">ชื่อผู้ใช้งาน</label>
            <div class="input-group custom-input-group">
              <span class="input-group-text"><i class="fa-solid fa-circle-user"></i></span>
              <input type="text" class="form-control" name="username" placeholder="Username" required>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label small fw-bold text-muted">รหัสผ่าน</label>
            <div class="input-group custom-input-group">
              <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
              <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
              <span class="input-group-text" onclick="password_show_hide();" style="cursor: pointer;">
                <i class="fas fa-eye" id="show_eye"></i>
                <i class="fas fa-eye-slash d-none" id="hide_eye"></i>
              </span>
            </div>
          </div>

          <button type="submit" class="btn btn-dark w-100 btn-login-submit" id="btnFormlogin">
            <i class="fa-solid fa-right-to-bracket me-2"></i>เข้าสู่ระบบ
          </button>
          
          <button class="btn btn-dark w-100 btn-login-submit" type="button" id="btnFormlogin2" style="display:none" disabled>
            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            กำลังตรวจสอบ...
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  let admin = "";
  var table, t, userName;

  // ป้องกัน Login หลุด
  $(document).ready(function() {
    userName = sessionStorage.getItem('userName');
    getAllData(admin);
    loadstart();
    
    if (userName != null) {
      admin = userName.split(',')[2];
      document.getElementById('admin').innerText = admin;
      document.getElementById('btnlogout').style.display = "block";
      document.getElementById('btnlogin').style.display = "none";  
      document.getElementById('btnRun').style.display = "block";
    } else {
      document.getElementById('btnlogout').style.display = "none";
      document.getElementById('btnlogin').style.display = "block";
    }

    google.script.run.withSuccessHandler((dataPic) => {
      if (dataPic == "") {
        document.getElementById("picHeader").style.display = "none";
      }
    }).getPic();
  });

  // เข้าระบบ
  function loginForm(obj) {
    event.preventDefault();
    document.getElementById('btnFormlogin').style.display = "none";
    document.getElementById('btnFormlogin2').style.display = "block";

    google.script.run.withSuccessHandler(dataArray => {
      console.log('dataArray:', dataArray);
      if (dataArray != null) {
        sessionStorage.setItem('userName', dataArray);
        admin = dataArray[2];
        document.getElementById('admin').innerText = admin;
        
        // จัดการ UI หลัง Login สำเร็จ
        document.getElementById('btnlogout').style.display = "block";
        document.getElementById('btnlogin').style.display = "none";
        document.getElementById('btnclose').click();
        document.getElementById('loginForm').reset();
        document.getElementById('btnRun').style.display = "block";
        
        getAllData(admin);
        
        Swal.fire({
          icon: 'success',
          title: 'ยินดีต้อนรับ',
          text: 'เข้าสู่ระบบเรียบร้อยแล้ว',
          timer: 1500,
          showConfirmButton: false
        });
      } else {
        Swal.fire({
          icon: 'error',
          title: 'เข้าสู่ระบบไม่สำเร็จ',
          text: 'ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง',
          confirmButtonColor: '#343a40'
        });
      }
      document.getElementById('btnFormlogin2').style.display = "none";
      document.getElementById('btnFormlogin').style.display = "block";
    }).loginData(obj);
  }

  // ออกจากระบบ
  function logout() {
    Swal.fire({
      title: 'ยืนยันการออกจากระบบ?',
      text: "คุณต้องการออกจากระบบใช่หรือไม่",
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#212529',
      cancelButtonColor: '#d33',
      confirmButtonText: 'ออกจากระบบ',
      cancelButtonText: 'ยกเลิก'
    }).then((result) => {
      if (result.isConfirmed) {
        sessionStorage.removeItem('userName');
        document.getElementById('btnlogout').style.display = "none";
        document.getElementById('btnlogin').style.display = "block";
        admin = "";
        getAllData(admin);
        document.getElementById('btnRun').style.display = "none";
      }
    });
  }

  // ปิดเปิดตา password
  function password_show_hide() {
    var x = document.getElementById("password");
    var show_eye = document.getElementById("show_eye");
    var hide_eye = document.getElementById("hide_eye");
    hide_eye.classList.remove("d-none");
    if (x.type === "password") {
      x.type = "text";
      show_eye.style.display = "none";
      hide_eye.style.display = "block";
    } else {
      x.type = "password";
      show_eye.style.display = "block";
      hide_eye.style.display = "none";
    }
  }
</script>
</body>
</html>
