<script>
  // ฟังก์ชันสลับโหมดสี
  function toggleTheme() {
    const body = document.body;
    const icon = document.getElementById('theme-icon');
    const currentTheme = body.getAttribute('data-theme');
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    
    body.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme-preference', newTheme);
    
    if(newTheme === 'light') {
      icon.classList.replace('fa-moon', 'fa-sun');
    } else {
      icon.classList.replace('fa-sun', 'fa-moon');
    }
  }

  // ตรวจสอบ Theme ที่บันทึกไว้
  const savedTheme = localStorage.getItem('theme-preference') || 'dark';
  document.body.setAttribute('data-theme', savedTheme);
  if(savedTheme === 'light') setTimeout(() => document.getElementById('theme-icon').classList.replace('fa-moon', 'fa-sun'), 100);

  function getAllData(admin){
    google.script.run.withSuccessHandler(showData).getData(admin);
  }
  
  function showData(dataArray){
    loadEnd();
    $(document).ready(function(){
      table = $('#data-table').DataTable({
        data: dataArray,
        searching: false, // ปิดช่องค้นหาตามต้องการ
        columns: [
          { title:"ลำดับ"},
          { title:"ชื่อ-นามสกุล"},
          { title:"หน่วยงาน/สาขา"},
          { title: "เกียรติบัตร",
            render: function (data) {    
             if(data != ''){
               return '<a target="_blank" href="'+data+'" class="btn btn-sm btn-download"><i class="fa-solid fa-download me-1"></i> ดาวน์โหลด</a>';
             }
             return '<span class="text-muted small">รอดำเนินการ</span>';
            },
          }, 
          { title:"status"},
          { title:"Row",
            render: function (data) {  
              return '<span class="badge bg-secondary opacity-50">'+data+'</span>'
            }
          }, 
          { title: "จัดการ" ,defaultContent: "<button type='button' class='btn btn-sm btn-outline-info rounded-pill' onclick='updateData(this);'><i class='fa-solid fa-pen-to-square'></i></button>"
          },
        ],
        columnDefs: [ 
          (admin !== "Admin")?{targets: [5,6],visible: false,}:{targets: [5,6],visible: true,},
          {targets:[1,3], className:'all'},
          {targets: [4], visible: false}
        ],
        lengthMenu: [[20, 50, 100], [20, 50, 100]],
        pageLength: 20,
        responsive: true,
        ordering: false,
        destroy: true,
        language: {
          sLengthMenu: "แสดง _MENU_ รายชื่อต่อหน้า",
          sInfo: "พบทั้งหมด _TOTAL_ รายชื่อ",
          oPaginate: {
            sPrevious: "<i class='fa-solid fa-angle-left'></i>",
            sNext: "<i class='fa-solid fa-angle-right'></i>"
          }
        }
      });
    });
  } 

  function loadstart(){ document.getElementById("loading").classList.remove('invisible'); document.getElementById("loading").style.display = 'flex'; }
  function loadEnd(){ document.getElementById("loading").classList.add('invisible'); document.getElementById("loading").style.display = 'none'; }

  window.addEventListener('load', () => {
     setTimeout(loadEnd, 800);
  });
</script>
